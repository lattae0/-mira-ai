<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mira AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111014;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #29252e;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #e9a5c8;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    color: white;
    background: #bd669a;
    font-size: 14px;
}

input, textarea {
    background: #24212a;
    border: 1px solid #39333f;
    color: white;
    border-radius: 12px;
    padding: 13px;
    width: 100%;
    outline: none;
    font-size: 15px;
}

.container {
    padding: 20px;
    max-width: 750px;
    margin: auto;
}

h2 {
    margin: 25px 0 15px;
}

.search {
    margin: 15px 0;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 10px 0;
}

.category {
    background: #29242e;
    white-space: nowrap;
}

.character {
    background: #201c25;
    border: 1px solid #302a36;
    border-radius: 17px;
    padding: 16px;
    margin-bottom: 13px;
    display: flex;
    gap: 15px;
    align-items: center;
    cursor: pointer;
}

.avatar {
    width: 65px;
    height: 65px;
    border-radius: 15px;
    background: #594054;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    flex-shrink: 0;
}

.character p {
    color: #aaa2b1;
    font-size: 13px;
    margin-top: 6px;
}

#chatScreen, #createScreen {
    display: none;
}

.chatHeader {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    background: #201c25;
}

.messages {
    padding: 15px;
    height: 65vh;
    overflow-y: auto;
}

.message {
    max-width: 85%;
    padding: 13px;
    margin-bottom: 12px;
    border-radius: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #a94e83;
    margin-left: auto;
}

.bot {
    background: #29242e;
    margin-right: auto;
}

.chatInput {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #201c25;
}

.chatInput input {
    flex: 1;
}

.form {
    display: grid;
    gap: 13px;
    margin-top: 20px;
}

.bottom {
    position: sticky;
    bottom: 0;
    background: #111014;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    border-top: 1px solid #29252e;
}
</style>
</head>

<body>

<header>
    <div class="logo">mira.</div>
    <button onclick="showCreate()">+ Create</button>
</header>

<main id="homeScreen" class="container">

    <h2>Discover characters</h2>

    <input class="search" id="search"
    placeholder="Search characters..."
    oninput="searchCharacters()">

    <div class="categories">
        <button class="category" onclick="filterCategory('All')">For You</button>
        <button class="category" onclick="filterCategory('Romance')">Romance</button>
        <button class="category" onclick="filterCategory('Fantasy')">Fantasy</button>
        <button class="category" onclick="filterCategory('Drama')">Drama</button>
        <button class="category" onclick="filterCategory('Mystery')">Mystery</button>
    </div>

    <div id="characterList"></div>

</main>

<section id="chatScreen">

    <div class="chatHeader">
        <button onclick="goHome()">←</button>
        <div>
            <strong id="chatName">Character</strong>
            <p style="font-size:12px;color:#aaa">AI Character</p>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="chatInput">
        <input id="messageInput"
        placeholder="Message..."
        onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">➤</button>
    </div>

</section>

<section id="createScreen" class="container">

    <button onclick="goHome()">← Back</button>

    <h2>Create your character</h2>

    <div class="form">
        <input id="newName" placeholder="Character name">
        <input id="newTagline" placeholder="Short description">
        <input id="newCategory" placeholder="Category (Romance, Fantasy...)">
        <textarea id="newPersonality"
        placeholder="Describe the character's personality..."
        rows="5"></textarea>
        <textarea id="newGreeting"
        placeholder="First message / greeting..."
        rows="4"></textarea>

        <button onclick="createCharacter()">Create character</button>
    </div>

</section>

<script>

let characters = JSON.parse(localStorage.getItem("miraCharacters")) || [
{
    name: "Adrian",
    tagline: "A quiet stranger with a complicated past.",
    category: "Romance",
    personality: "You are Adrian, a thoughtful, observant and reserved fictional character. Stay in character, remember the conversation and respond naturally.",
    greeting: "You weren't supposed to find me here. So... what brings you here?"
},
{
    name: "Rowan",
    tagline: "Your rival who knows you too well.",
    category: "Drama",
    personality: "You are Rowan, confident, sarcastic and secretly caring. Stay in character and maintain continuity.",
    greeting: "Oh, it's you again. Didn't think I'd see you today."
},
{
    name: "Elias",
    tagline: "A mysterious man from another world.",
    category: "Fantasy",
    personality: "You are Elias, mysterious, intelligent and calm. Stay in character and respond naturally.",
    greeting: "You have entered a place where you do not belong."
},
{
    name: "Noah",
    tagline: "The boy next door.",
    category: "Romance",
    personality: "You are Noah, friendly, playful and affectionate. Stay in character.",
    greeting: "Hey! I've been waiting for you."
}
];

let activeCharacter = null;
let conversation = [];

function saveCharacters() {
    localStorage.setItem("miraCharacters", JSON.stringify(characters));
}

function displayCharacters(list = characters) {

    const area = document.getElementById("characterList");
    area.innerHTML = "";

    list.forEach((character, index) => {

        const card = document.createElement("div");
        card.className = "character";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = character.name.charAt(0).toUpperCase();

        const details = document.createElement("div");

        const title = document.createElement("strong");
        title.textContent = character.name;

        const description = document.createElement("p");
        description.textContent = character.tagline;

        details.append(title, description);
        card.append(avatar, details);

        card.onclick = () => openChat(character);

        area.appendChild(card);
    });
}

function searchCharacters() {

    const query = document.getElementById("search").value.toLowerCase();

    const results = characters.filter(character =>
        character.name.toLowerCase().includes(query) ||
        character.tagline.toLowerCase().includes(query) ||
        character.category.toLowerCase().includes(query)
    );

    displayCharacters(results);
}

function filterCategory(category) {

    if (category === "All") {
        displayCharacters();
        return;
    }

    displayCharacters(
        characters.filter(character =>
            character.category.toLowerCase() === category.toLowerCase()
        )
    );
}

function openChat(character) {

    activeCharacter = character;
    conversation = [];

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("createScreen").style.display = "none";
    document.getElementById("chatScreen").style.display = "block";

    document.getElementById("chatName").textContent = character.name;
    document.getElementById("messages").innerHTML = "";

    addMessage(character.greeting, "bot");

    conversation.push({
        role: "assistant",
        content: character.greeting
    });
}

function addMessage(text, type) {

    const area = document.getElementById("messages");
    const bubble = document.createElement("div");

    bubble.className = "message " + type;
    bubble.textContent = text;

    area.appendChild(bubble);
    area.scrollTop = area.scrollHeight;
}

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text || !activeCharacter) return;

    input.value = "";

    addMessage(text, "user");

    conversation.push({
        role: "user",
        content: text
    });

    const typing = document.createElement("div");
    typing.className = "message bot";
    typing.textContent = "Typing...";
    document.getElementById("messages").appendChild(typing);

    try {

        const response = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                character: activeCharacter,
                messages: conversation
            })
        });

        const data = await response.json();

        typing.remove();

        if (!response.ok) {
            throw new Error(data.error || "AI connection failed.");
        }

        const reply = data.reply;

        conversation.push({
            role: "assistant",
            content: reply
        });

        addMessage(reply, "bot");

    } catch (error) {

        typing.remove();

        addMessage(
            "I couldn't connect right now. Please try again. (" + error.message + ")",
            "bot"
        );
    }
}

function showCreate() {

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("chatScreen").style.display = "none";
    document.getElementById("createScreen").style.display = "block";
}

function createCharacter() {

    const name = document.getElementById("newName").value.trim();
    const tagline = document.getElementById("newTagline").value.trim();
    const category = document.getElementById("newCategory").value.trim();
    const personality = document.getElementById("newPersonality").value.trim();
    const greeting = document.getElementById("newGreeting").value.trim();

    if (!name || !personality || !greeting) {
        alert("Please enter a name, personality and greeting.");
        return;
    }

    characters.unshift({
        name,
        tagline: tagline || "A new character.",
        category: category || "Other",
        personality,
        greeting
    });

    saveCharacters();

    document.getElementById("newName").value = "";
    document.getElementById("newTagline").value = "";
    document.getElementById("newCategory").value = "";
    document.getElementById("newPersonality").value = "";
    document.getElementById("newGreeting").value = "";

    goHome();
}

function goHome() {

    document.getElementById("homeScreen").style.display = "block";
    document.getElementById("chatScreen").style.display = "none";
    document.getElementById("createScreen").style.display = "none";

    displayCharacters();
}

displayCharacters();

</script>

</body>
</html>
